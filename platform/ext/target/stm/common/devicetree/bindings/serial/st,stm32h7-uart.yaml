description: STMicroelectronics STM32 UART

compatible: "st,stm32h7-uart"

include:
  - name: base.yaml
  - name: reset-device.yaml
  - name: pinctrl-device.yaml
  - name: uart-controller.yaml
    property-allowlist:
      - current-speed
      - parity
      - stop-bits
      - data-bits
      - flow-ctrl

properties:
  reg:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
