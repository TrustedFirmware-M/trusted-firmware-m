description: |
  The STM32 hardware random number generator is a simple fixed purpose
  IP and is fully separated from other crypto functions.

include:
  - access-device.yaml
  - name: base.yaml
  - name: reset-device.yaml

properties:
  reg:
    required: true

  resets:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
    enum:
      - "rng_clk"
      - "rng_hclk"
    description: |
      Expected names are the following:
      - "rng_clk" is the RNG clock domain source, used to compute CLKDIV
      - "rng_hclk" is the AHB bus clock feeding the peripheral
      rng_clk may be backed by a clock controller or by a fixed-clock device without clk_subsys
