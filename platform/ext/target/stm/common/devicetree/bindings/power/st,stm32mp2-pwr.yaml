description: |
  STMicroelectronics power control (PWR) provides an overview of the supply
  architecture of the different power domains of STM32MP2 family.

include:
  - base.yaml
  - reset-device.yaml

properties:
  reg:
    required: true

  resets:
    required: true
    description: |
      backup domain reset

  st,popl-d1-ms:
    type: int
    description: |
      PWR_CPU_ON pulse low configuration (PWR_D1CR)

  st,podh-d2-ms:
    type: int
    description: |
      PWR_ON delay high configuration (PWR_D2CR)

  st,popl-d2-ms:
    type: int
    description: |
      PWR_ON pulse low configuration (PWR_D2CR)

  st,lpcfg-d2:
    type: int
    description: |
      PWR_ON pin configuration (PWR_D2CR)

  st,lplvdly-d2:
      type: int
      description: |
        LPLV delay value (PWR_D2CR), 3bits and with 6xLSI cycles unit
        (0:187 μs... 111:1.5 ms)
