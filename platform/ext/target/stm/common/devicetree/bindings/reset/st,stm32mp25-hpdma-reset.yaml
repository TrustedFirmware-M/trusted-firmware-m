description: |
  STM32 HPDMA Reset node.
  This node is in charge of hpdma ip reset.

compatible: "st,stm32mp25-hpdma-reset"

include: [reset-controller.yaml, base.yaml]

properties:
  "#reset-cells":
    const: 1
    description: Since full ip is reset, only cell value to 0 is supported

reset-cells:
  - id
